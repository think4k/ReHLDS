name: C/C++ CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/**'

  pull_request:
    types: [opened, reopened, synchronize]

  release:
    types: [published]

  workflow_dispatch:

jobs:

  # ============================================================
  # Windows
  # ============================================================
  windows:
    name: 'Windows'
    runs-on: windows-2025

    env:
      solution: 'msvc/ReHLDS.sln'
      buildPlatform: 'Win32'
      buildRelease: 'Release'
      buildReleasePlay: 'Release Play'
      buildTest: 'Test Fixes'

    steps:

      - name: Configure
        shell: pwsh
        run: |
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # TODO: add support of 141_xp toolchain at VS2022+
      # - name: Install v140, v141 and v142 toolsets
      #   shell: cmd
      #   run: |
      #     "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify ^
      #     --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" ^
      #     --add Microsoft.VisualStudio.Component.WindowsXP ^
      #     --add Microsoft.VisualStudio.Component.VC.v140 ^
      #     --add Microsoft.VisualStudio.Component.VC.v140.x86.x64 ^
      #     --add Microsoft.VisualStudio.Component.VC.v140.xp ^
      #     --add Microsoft.VisualStudio.Component.VC.140.CRT ^
      #     --add Microsoft.VisualStudio.Component.VC.v141 ^
      #     --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 ^
      #     --add Microsoft.VisualStudio.Component.VC.v141.xp ^
      #     --add Microsoft.VisualStudio.Component.VC.v142 ^
      #     --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 ^
      #     --quiet --norestart

      - name: Select PlatformToolset
        id: select_toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found: $vswhere"
            exit 1
          }

          $vs2019 = & $vswhere `
            -products * `
            -version "[16.0,17.0)" `
            -property installationPath `
            -latest

          $vs2022 = & $vswhere `
            -products * `
            -version "[17.0,)" `
            -property installationPath `
            -latest

          if ($vs2019) {
            "toolset=v140_xp" >> $env:GITHUB_OUTPUT
            Write-Host "Selected Visual Studio 2019 / v140_xp"
          }
          elseif ($vs2022) {
            "toolset=v143" >> $env:GITHUB_OUTPUT
            Write-Host "Selected Visual Studio 2022 / v143"
          }
          else {
            Write-Error "No suitable Visual Studio installation found"
            exit 1
          }

      - name: Build and Run unittests
        shell: pwsh
        run: |
          $toolset = '${{ steps.select_toolset.outputs.toolset }}'

          msbuild ${{ env.solution }} `
            -p:Configuration="${{ env.buildTest }}" `
            /t:Clean,Build `
            /p:Platform=${{ env.buildPlatform }} `
            /p:PlatformToolset=$toolset `
            /p:XPDeprecationWarning=false

          & "${{ github.workspace }}\msvc\Test Fixes\swds.exe"

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) {
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          $toolset = '${{ steps.select_toolset.outputs.toolset }}'

          msbuild ${{ env.solution }} `
            -p:Configuration="${{ env.buildRelease }}" `
            /t:Clean,Build `
            /p:Platform=${{ env.buildPlatform }} `
            /p:PlatformToolset=$toolset `
            /p:XPDeprecationWarning=false

          msbuild ${{ env.solution }} `
            -p:Configuration="${{ env.buildReleasePlay }}" `
            /t:Clean,Build `
            /p:Platform=${{ env.buildPlatform }} `
            /p:PlatformToolset=$toolset `
            /p:XPDeprecationWarning=false

      - name: Get rcedit from chocolatey
        shell: pwsh
        run: |
          choco install rcedit -y --no-progress

      - name: Move files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish\debug" | Out-Null
          New-Item -ItemType Directory -Force -Path "publish\tests" | Out-Null
          New-Item -ItemType Directory -Force -Path "publish\bin\win32\valve\dlls" | Out-Null

          Move-Item `
            "msvc\${{ env.buildReleasePlay }}\swds.dll" `
            "publish\tests\swds.dll" `
            -Force

          Move-Item "msvc\${{ env.buildRelease }}\hlds.exe" `
            "publish\bin\win32\hlds.exe" -Force

          Move-Item "msvc\${{ env.buildRelease }}\hltv.exe" `
            "publish\bin\win32\hltv.exe" -Force

          Move-Item "msvc\${{ env.buildRelease }}\swds.dll" `
            "publish\bin\win32\swds.dll" -Force

          Move-Item "msvc\${{ env.buildRelease }}\core.dll" `
            "publish\bin\win32\core.dll" -Force

          Move-Item "msvc\${{ env.buildRelease }}\proxy.dll" `
            "publish\bin\win32\proxy.dll" -Force

          Move-Item "msvc\${{ env.buildRelease }}\demoplayer.dll" `
            "publish\bin\win32\demoplayer.dll" -Force

          Move-Item "msvc\${{ env.buildRelease }}\filesystem_stdio.dll" `
            "publish\bin\win32\filesystem_stdio.dll" -Force

          Move-Item "msvc\${{ env.buildRelease }}\director.dll" `
            "publish\bin\win32\valve\dlls\director.dll" -Force

          Move-Item "msvc\${{ env.buildRelease }}\hlds.pdb" `
            "publish\debug\hlds.pdb" -Force

          Move-Item "msvc\${{ env.buildRelease }}\hltv.pdb" `
            "publish\debug\hltv.pdb" -Force

          Move-Item "msvc\${{ env.buildRelease }}\swds.pdb" `
            "publish\debug\swds.pdb" -Force

          Move-Item "msvc\${{ env.buildRelease }}\core.pdb" `
            "publish\debug\core.pdb" -Force

          Move-Item "msvc\${{ env.buildRelease }}\proxy.pdb" `
            "publish\debug\proxy.pdb" -Force

          Move-Item "msvc\${{ env.buildRelease }}\demoplayer.pdb" `
            "publish\debug\demoplayer.pdb" -Force

          Move-Item "msvc\${{ env.buildRelease }}\filesystem_stdio.pdb" `
            "publish\debug\filesystem_stdio.pdb" -Force

          Move-Item "msvc\${{ env.buildRelease }}\director.pdb" `
            "publish\debug\director.pdb" -Force

      - name: Get app version
        id: get_version
        shell: pwsh
        run: |
          $versionFile = "rehlds/version/appversion.h"

          if (-not (Test-Path $versionFile)) {
            Write-Error "Version file not found: $versionFile"
            exit 1
          }

          foreach ($line in Get-Content $versionFile) {
            if ($line -match '^\s*#define\s+APP_VERSION\s+"([^"]+)"') {
              $version = $matches[1]
              "version=$version" >> $env:GITHUB_OUTPUT
              Write-Host "Found version: $version"
              exit 0
            }
          }

          Write-Error "APP_VERSION not found in file"
          exit 1

      - name: Show version
        shell: pwsh
        run: |
          Write-Host "Version is ${{ steps.get_version.outputs.version }}"

      - name: Edit resources at windows binaries
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $commit = $env:GITHUB_SHA
          $icon = "${{ github.workspace }}\rehlds\dedicated\msvc\icon.ico"

          rcedit "${{ github.workspace }}\publish\bin\win32\hlds.exe" `
            --set-version-string ProductName "ReHLDS" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "The Half-Life Dedicated Server, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam"

          rcedit "${{ github.workspace }}\publish\bin\win32\hltv.exe" `
            --set-version-string ProductName "ReHLTV" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "The Half-Life TV, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam"

          rcedit "${{ github.workspace }}\publish\tests\swds.dll" `
            --set-version-string ProductName "swds.dll" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "A dll used by Steamworks Dedicated Servers, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" `
            --set-icon "$icon"

          rcedit "${{ github.workspace }}\publish\bin\win32\swds.dll" `
            --set-version-string ProductName "swds.dll" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "A dll used by Steamworks Dedicated Servers, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" `
            --set-icon "$icon"

          rcedit "${{ github.workspace }}\publish\bin\win32\core.dll" `
            --set-version-string ProductName "core.dll" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "A dll, it is a core of game engine, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" `
            --set-icon "$icon"

          rcedit "${{ github.workspace }}\publish\bin\win32\proxy.dll" `
            --set-version-string ProductName "proxy.dll" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "A dll for proxying network connections, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" `
            --set-icon "$icon"

          rcedit "${{ github.workspace }}\publish\bin\win32\demoplayer.dll" `
            --set-version-string ProductName "demoplayer.dll" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "A dll for demoplayer functionality, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" `
            --set-icon "$icon"

          rcedit "${{ github.workspace }}\publish\bin\win32\filesystem_stdio.dll" `
            --set-version-string ProductName "filesystem_stdio.dll" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "A dll that manages file input/output operations, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" `
            --set-icon "$icon"

          rcedit "${{ github.workspace }}\publish\bin\win32\valve\dlls\director.dll" `
            --set-version-string ProductName "director.dll" `
            --set-file-version "$version" `
            --set-product-version "$version" `
            --set-version-string FileDescription "A dll used for Director functionality in Half-Life 1, Commit: $commit" `
            --set-version-string Comments "Commit: $commit" `
            --set-version-string CompanyName "ReHLDS Dev Team" `
            --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" `
            --set-icon "$icon"

      # ----------------------------------------------------------
      # Code signing
      # ----------------------------------------------------------
      - name: Import PFX and sign
        if: github.event_name != 'pull_request'
        env:
          KEY_PFX_B64: ${{ secrets.KEY_PFX_B64 }}
          KEY_PFX_PASS: ${{ secrets.KEY_PFX_PASS }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "signing-cert.pfx"

          try {
            if ([string]::IsNullOrWhiteSpace($env:KEY_PFX_B64)) {
              throw "KEY_PFX_B64 secret is empty or missing."
            }

            if ([string]::IsNullOrWhiteSpace($env:KEY_PFX_PASS)) {
              throw "KEY_PFX_PASS secret is empty or missing."
            }

            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:KEY_PFX_B64)
            )

            if (-not (Test-Path $pfxPath)) {
              throw "Failed to create PFX file."
            }

            # Find the newest installed signtool instead of relying
            # on one hard-coded Windows SDK version.
            $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter "signtool.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x86\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $signtool) {
              $signtool = Get-ChildItem `
                "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                -Filter "signtool.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1
            }

            if (-not $signtool) {
              throw "signtool.exe was not found."
            }

            $signtoolPath = $signtool.FullName

            Write-Host "Using signtool:"
            Write-Host $signtoolPath

            $files = @(
              @{
                Path = "${{ github.workspace }}\publish\bin\win32\hlds.exe"
                Description = "ReHLDS"
              },
              @{
                Path = "${{ github.workspace }}\publish\bin\win32\hltv.exe"
                Description = "ReHLTV"
              },
              @{
                Path = "${{ github.workspace }}\publish\tests\swds.dll"
                Description = "ReHLDS - swds.dll"
              },
              @{
                Path = "${{ github.workspace }}\publish\bin\win32\swds.dll"
                Description = "ReHLDS - swds.dll"
              },
              @{
                Path = "${{ github.workspace }}\publish\bin\win32\core.dll"
                Description = "ReHLDS - core.dll"
              },
              @{
                Path = "${{ github.workspace }}\publish\bin\win32\proxy.dll"
                Description = "ReHLDS - proxy.dll"
              },
              @{
                Path = "${{ github.workspace }}\publish\bin\win32\demoplayer.dll"
                Description = "ReHLDS - demoplayer.dll"
              },
              @{
                Path = "${{ github.workspace }}\publish\bin\win32\filesystem_stdio.dll"
                Description = "ReHLDS - filesystem_stdio.dll"
              },
              @{
                Path = "${{ github.workspace }}\publish\bin\win32\valve\dlls\director.dll"
                Description = "ReHLDS - director.dll"
              }
            )

            foreach ($file in $files) {
              if (-not (Test-Path $file.Path)) {
                throw "File to sign was not found: $($file.Path)"
              }

              Write-Host ""
              Write-Host "Signing $($file.Path)"

              & $signtoolPath sign `
                /a `
                /f $pfxPath `
                /p $env:KEY_PFX_PASS `
                /d $file.Description `
                /du "https://rehlds.dev/" `
                /tr "http://timestamp.digicert.com" `
                /td sha256 `
                /fd sha256 `
                /v `
                $file.Path

              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed for $($file.Path) with exit code $LASTEXITCODE"
              }
            }

            Write-Host ""
            Write-Host "All Windows binaries signed successfully."
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue
            }
          }

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win32
          path: publish/*


  # ============================================================
  # Test demos
  # ============================================================
  testdemos:
    name: 'Test demos'
    runs-on: ubuntu-24.04
    container: rehldsorg/testdemos:latest
    needs: [windows]

    defaults:
      run:
        shell: bash
        working-directory: /opt/HLDS

    strategy:
      fail-fast: false
      matrix:
        test:
          - file: 'cstrike-muliplayer-1'
            desc: 'CS: Multiplayer'

          - file: 'rehlds-phys-single1'
            desc: 'Half-Life: Physics singleplayer'

          - file: 'crossfire-1-multiplayer-1'
            desc: 'Half-Life: Multiplayer on crossfire map'

          - file: 'shooting-hl-1'
            desc: 'Half-Life: Shooting with several weapons'

    steps:

      - name: Deploying windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win32

      - name: Setup dependencies
        run: |
          chown root ~
          rsync -a deps/rehlds/* .
          mv "$GITHUB_WORKSPACE/tests/swds.dll" .

      - name: Play test
        env:
          demo: ${{ matrix.test.file }}
          desc: ${{ matrix.test.desc }}
        run: ./runTest.sh


  # ============================================================
  # Linux
  # ============================================================
  linux:
    name: 'Linux'
    runs-on: ubuntu-24.04

    steps:

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            build-essential \
            libc6-dev \
            libc6-dev-i386 \
            git \
            cmake \
            rsync

      - name: Configure
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GPG Import
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -e

          PUB_FILE="$RUNNER_TEMP/rehlds-public.asc"
          KEY_FILE="$RUNNER_TEMP/rehlds-private.asc"

          echo "${{ secrets.PUB_ASC }}" > "${{ secrets.PUB_ASC_FILE }}"
          echo "${{ secrets.KEY_ASC }}" > "${{ secrets.KEY_ASC_FILE }}"

          echo "Importing public key..."
          gpg --batch --yes --import "${{ secrets.PUB_ASC_FILE }}"

          echo "Importing private key..."
          gpg --batch --yes --import "${{ secrets.KEY_ASC_FILE }}"

          GPG_LINUX_FINGERPRINT=$(
            gpg --list-keys --with-colons |
            awk -F: '$1 == "fpr" {print $10; exit}'
          )

          if [[ -z "$GPG_LINUX_FINGERPRINT" ]]; then
            echo "Error: Failed to extract the fingerprint of the key"
            exit 1
          fi

          echo "$GPG_LINUX_FINGERPRINT:6:" |
            gpg --batch --import-ownertrust

          echo "GPG_LINUX_FINGERPRINT=$GPG_LINUX_FINGERPRINT" >> "$GITHUB_ENV"

          echo "Key $GPG_LINUX_FINGERPRINT successfully imported and trusted"
          gpg --list-keys

      - name: Build and Run unittests
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake \
            -DCMAKE_BUILD_TYPE=Unittests \
            -B build

          cmake --build build -j"$(nproc)"

          retVal=0

          export LD_LIBRARY_PATH="rehlds/lib/linux32:${LD_LIBRARY_PATH:-}"

          ./build/rehlds/engine_i486 \
            2> /dev/null > result.log || retVal=$?

          while IFS= read -r line; do
            if [[ "$line" == *"Warning in test"* ]]; then
              echo -e "\e[2;38m$line"
            elif [[ "$line" == *"Failure in test"* ]]; then
              echo -e "\e[1;31m$line"
            else
              echo -e "\e[0;33m$line"
            fi
          done < result.log

          if [[ $retVal -ne 0 && $retVal -ne 3 ]]; then
            echo -e "\e[30;41mExit code: $retVal\e[0m"
            exit 1
          fi

          echo -e "\e[30;43mExit code: $retVal\e[0m"

      - name: Build using GCC Compiler
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake -B build
          cmake --build build -j"$(nproc)"

      - name: Prepare HLSDK
        shell: bash
        run: |
          set -e

          mkdir -p publish/hlsdk

          rsync -a \
            rehlds/common/ \
            publish/hlsdk/common/

          rsync -a \
            rehlds/dlls/ \
            publish/hlsdk/dlls/

          rsync -a \
            rehlds/pm_shared/ \
            publish/hlsdk/pm_shared/

          rsync -a \
            rehlds/public/ \
            publish/hlsdk/public/ \
            --exclude rehlds/

          rsync -a \
            rehlds/public/rehlds/ \
            publish/hlsdk/engine

      - name: Move files
        shell: bash
        run: |
          set -e

          mkdir -p publish/bin/linux32/valve/dlls

          mv \
            build/rehlds/engine_i486.so \
            publish/bin/linux32/engine_i486.so

          mv \
            rehlds/version/appversion.h \
            publish/appversion.h

          mv \
            build/rehlds/dedicated/hlds_linux \
            publish/bin/linux32/hlds_linux

          mv \
            build/rehlds/HLTV/Console/hltv \
            publish/bin/linux32/hltv

          mv \
            build/rehlds/HLTV/Core/core.so \
            publish/bin/linux32/core.so

          mv \
            build/rehlds/HLTV/Proxy/proxy.so \
            publish/bin/linux32/proxy.so

          mv \
            build/rehlds/HLTV/DemoPlayer/demoplayer.so \
            publish/bin/linux32/demoplayer.so

          mv \
            build/rehlds/HLTV/Director/director.so \
            publish/bin/linux32/valve/dlls/director.so

          mv \
            build/rehlds/filesystem/FileSystem_Stdio/filesystem_stdio.so \
            publish/bin/linux32/filesystem_stdio.so

      - name: Run GLIBC/ABI version compat test
        shell: bash
        run: |
          set -e

          binaries=(
            "publish/bin/linux32/engine_i486.so"
            "publish/bin/linux32/hlds_linux"
            "publish/bin/linux32/hltv"
            "publish/bin/linux32/core.so"
            "publish/bin/linux32/proxy.so"
            "publish/bin/linux32/demoplayer.so"
            "publish/bin/linux32/valve/dlls/director.so"
            "publish/bin/linux32/filesystem_stdio.so"
          )

          bash ./rehlds/version/glibc_test.sh "${binaries[@]}"

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux32
          path: publish/*


  # ============================================================
  # Publish
  # ============================================================
  publish:
    name: 'Publish'
    runs-on: ubuntu-24.04
    needs: [windows, testdemos, linux]

    steps:

      - name: Deploying linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux32

      - name: Deploying windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win32

      - name: Reading appversion.h
        shell: bash
        run: |
          set -e

          if [[ -e appversion.h ]]; then
            APP_VERSION=$(
              grep -wi '#define APP_VERSION_STRD' appversion.h |
              sed \
                -e 's/#define APP_VERSION_STRD[ \t\r\n\v\f]\+\(.*\)/\1/i' \
                -e 's/\r//g'
            )

            APP_VERSION=$(echo "$APP_VERSION" | xargs)

            if [[ -n "$APP_VERSION" ]]; then
              echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
              echo "APP_VERSION=$APP_VERSION"
            else
              echo "APP_VERSION could not be determined"
              exit 1
            fi
          else
            echo "appversion.h not found"
            exit 1
          fi

          rm -f appversion.h

      - name: Set SIGN_READY env
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" &&
                "${{ github.event.action }}" == "published" &&
                "${{ github.ref }}" == refs/tags/* ]]; then

            echo "SIGN_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGN_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Final signing and Packaging bin/dbg
        id: packaging-job
        shell: bash
        run: |
          set -e

          if [[ "$SIGN_READY" == "true" ]]; then
            echo "Signing enabled."

            echo "${{ secrets.PUB_ASC }}" > "${{ secrets.PUB_ASC_FILE }}"
            echo "${{ secrets.KEY_ASC }}" > "${{ secrets.KEY_ASC_FILE }}"

            gpg --batch --yes --import "${{ secrets.PUB_ASC_FILE }}"
            gpg --batch --yes --import "${{ secrets.KEY_ASC_FILE }}"

            GPG_LINUX_FINGERPRINT=$(
              gpg --list-keys --with-colons |
              awk -F: '$1 == "fpr" {print $10; exit}'
            )

            if [[ -z "$GPG_LINUX_FINGERPRINT" ]]; then
              echo "Failed to obtain GPG fingerprint"
              exit 1
            fi

            echo "$GPG_LINUX_FINGERPRINT:6:" |
              gpg --batch --import-ownertrust

            echo "GPG_LINUX_FINGERPRINT=$GPG_LINUX_FINGERPRINT" >> "$GITHUB_ENV"

          else
            echo "Signing skipped."
          fi

          sign_file() {
            local file="$1"

            if [[ "$SIGN_READY" == "true" ]]; then
              gpg \
                --batch \
                --yes \
                --detach-sign \
                --armor \
                -u "$GPG_LINUX_FINGERPRINT" \
                "$file"

              echo "$file signed successfully."
            else
              echo "$file not signed (SIGN_READY=$SIGN_READY)"
            fi
          }

          echo "Creating binary package..."

          7z a \
            -tzip \
            "rehlds-bin-${APP_VERSION}.zip" \
            bin/ \
            hlsdk/

          sign_file "rehlds-bin-${APP_VERSION}.zip"

          echo "Creating debug package..."

          7z a \
            -t7z \
            -m0=lzma2 \
            -mx=9 \
            -mfb=64 \
            -aoa \
            "rehlds-dbg-${APP_VERSION}.7z" \
            debug/

          sign_file "rehlds-dbg-${APP_VERSION}.7z"

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rehlds-ci-${{ env.APP_VERSION }}
          path: |
            *.zip
            *.7z
            *.asc

      - name: Release artifacts
        if: |
          startsWith(github.ref, 'refs/tags/') &&
          steps.packaging-job.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.7z
            *.asc
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN }}
