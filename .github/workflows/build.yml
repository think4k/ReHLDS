 linux:
    name: 'Linux'
    runs-on: ubuntu-24.04

    # Keep Debian 11 intentionally.
    # ReHLDS uses this older userspace to maintain compatibility
    # with older Linux/GLIBC environments.
    container:
      image: debian:11-slim

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure Debian Bullseye archive
        shell: bash
        run: |
          set -euxo pipefail

          # Debian 11 is now an archived release.
          # Use the Debian archive instead of the normal mirrors.
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian bullseye-updates main
          EOF

          # Archived repository metadata has expired timestamps.
          cat > /etc/apt/apt.conf.d/99archive <<'EOF'
          Acquire::Check-Valid-Until "false";
          EOF

          # Bullseye LTS supports these architectures.
          dpkg --add-architecture i386

          apt-get update

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev \
            libc6-dev-i386 \
            git \
            cmake \
            rsync \
            ca-certificates

          rm -rf /var/lib/apt/lists/*

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== OS ==="
          cat /etc/os-release

          echo "=== GCC ==="
          gcc --version

          echo "=== G++ ==="
          g++ --version

          echo "=== CMake ==="
          cmake --version

          echo "=== GLIBC ==="
          ldd --version

          echo "=== Architecture ==="
          dpkg --print-architecture
          dpkg --print-foreign-architectures

      - name: Configure Git
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import GPG signing key
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.PUB_ASC }}" > "${{ secrets.PUB_ASC_FILE }}"
          echo "${{ secrets.KEY_ASC }}" > "${{ secrets.KEY_ASC_FILE }}"

          # Import public key
          gpg --batch --yes --import "${{ secrets.PUB_ASC_FILE }}"

          # Import private key
          gpg --batch --yes --import "${{ secrets.KEY_ASC_FILE }}"

          # Get the imported key fingerprint
          GPG_LINUX_FINGERPRINT="$(
            gpg --list-keys --with-colons |
            awk -F: '$1 == "fpr" { print $10; exit }'
          )"

          if [[ -z "$GPG_LINUX_FINGERPRINT" ]]; then
            echo "Error: failed to obtain GPG fingerprint"
            exit 1
          fi

          # Trust the key
          echo "${GPG_LINUX_FINGERPRINT}:6:" |
            gpg --batch --import-ownertrust

          echo "GPG fingerprint: ${GPG_LINUX_FINGERPRINT}"

          # Make it available to later steps
          echo "GPG_LINUX_FINGERPRINT=${GPG_LINUX_FINGERPRINT}" >> "$GITHUB_ENV"

      - name: Build and Run unittests
        shell: bash
        run: |
          set -uo pipefail

          rm -rf build

          cmake \
            -DCMAKE_BUILD_TYPE=Unittests \
            -B build

          cmake --build build --parallel 8

          retVal=0

          export LD_LIBRARY_PATH="rehlds/lib/linux32${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          ./build/rehlds/engine_i486 \
            2> /dev/null \
            > result.log || retVal=$?

          while IFS= read -r line; do
            if [[ "$line" == *"Warning in test"* ]]; then
              echo -e "\e[2;38m${line}\e[0m"
            elif [[ "$line" == *"Failure in test"* ]]; then
              echo -e "\e[1;31m${line}\e[0m"
            else
              echo -e "\e[0;33m${line}\e[0m"
            fi
          done < result.log

          if [[ "$retVal" -ne 0 && "$retVal" -ne 3 ]]; then
            echo -e "\e[30;41mExit code: ${retVal}\e[0m"
            exit 1
          fi

          echo -e "\e[30;43mExit code: ${retVal}\e[0m"

      - name: Build using GCC
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build

          cmake -B build

          cmake --build build --parallel 8

      - name: Prepare HLSDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p publish/hlsdk

          rsync -a \
            rehlds/common/ \
            publish/hlsdk/common/

          rsync -a \
            rehlds/dlls/ \
            publish/hlsdk/dlls/

          rsync -a \
            rehlds/pm_shared/ \
            publish/hlsdk/pm_shared/

          rsync -a \
            --exclude 'rehlds/' \
            rehlds/public/ \
            publish/hlsdk/public/

          rsync -a \
            rehlds/public/rehlds/ \
            publish/hlsdk/engine/

      - name: Move Linux binaries
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            publish/bin/linux32/valve/dlls

          mv \
            build/rehlds/engine_i486.so \
            publish/bin/linux32/engine_i486.so

          mv \
            rehlds/version/appversion.h \
            publish/appversion.h

          mv \
            build/rehlds/dedicated/hlds_linux \
            publish/bin/linux32/hlds_linux

          mv \
            build/rehlds/HLTV/Console/hltv \
            publish/bin/linux32/hltv

          mv \
            build/rehlds/HLTV/Core/core.so \
            publish/bin/linux32/core.so

          mv \
            build/rehlds/HLTV/Proxy/proxy.so \
            publish/bin/linux32/proxy.so

          mv \
            build/rehlds/HLTV/DemoPlayer/demoplayer.so \
            publish/bin/linux32/demoplayer.so

          mv \
            build/rehlds/HLTV/Director/director.so \
            publish/bin/linux32/valve/dlls/director.so

          mv \
            build/rehlds/filesystem/FileSystem_Stdio/filesystem_stdio.so \
            publish/bin/linux32/filesystem_stdio.so

      - name: Verify Linux binaries
        shell: bash
        run: |
          set -euxo pipefail

          binaries=(
            "publish/bin/linux32/engine_i486.so"
            "publish/bin/linux32/hlds_linux"
            "publish/bin/linux32/hltv"
            "publish/bin/linux32/core.so"
            "publish/bin/linux32/proxy.so"
            "publish/bin/linux32/demoplayer.so"
            "publish/bin/linux32/valve/dlls/director.so"
            "publish/bin/linux32/filesystem_stdio.so"
          )

          for binary in "${binaries[@]}"; do
            echo
            echo "========================================"
            echo "Checking: ${binary}"
            echo "========================================"

            test -f "$binary"

            file "$binary"
            readelf -h "$binary" | grep -E 'Class|Machine'
          done

      - name: Run GLIBC/ABI compatibility test
        shell: bash
        run: |
          set -euo pipefail

          binaries=(
            "publish/bin/linux32/engine_i486.so"
            "publish/bin/linux32/hlds_linux"
            "publish/bin/linux32/hltv"
            "publish/bin/linux32/core.so"
            "publish/bin/linux32/proxy.so"
            "publish/bin/linux32/demoplayer.so"
            "publish/bin/linux32/valve/dlls/director.so"
            "publish/bin/linux32/filesystem_stdio.so"
          )

          bash ./rehlds/version/glibc_test.sh "${binaries[@]}"

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux32
          path: publish/*
```
